# Paid launch topology, not a million-user capacity preset. See RUNTIME-IMPLEMENTATION.md.
databases:
  - name: chartpulse-distributed-db
    plan: 0.5c-1g
    region: singapore
    databaseName: chartpulse
    user: chartpulse
    connectionPool: pgbouncer
    ipAllowList: []
envVarGroups:
  - name: chartpulse-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: simulated
      - key: MARKET_DATA_MARKET
        value: NSE,BSE
      - key: MARKET_DATA_REDISPLAY_APPROVED
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: ALERT_SHARDS
        value: "2"
services:
  - type: keyvalue
    name: chartpulse-cache
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
  - type: web
    name: chartpulse-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STREAM_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: chartpulse-gateway
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:gateway
    healthCheckPath: /api/health
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
  - type: worker
    name: chartpulse-ingestion
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:ingestion
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
  - type: worker
    name: chartpulse-evaluator-0
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:evaluator
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
      - key: ALERT_SHARD
        value: "0"
  - type: worker
    name: chartpulse-evaluator-1
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:evaluator
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
      - key: ALERT_SHARD
        value: "1"
  - type: worker
    name: chartpulse-delivery
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:delivery
    envVars:
      - fromGroup: chartpulse-shared
      - key: DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionPoolString
      - key: LEADER_DATABASE_URL
        fromDatabase:
          name: chartpulse-distributed-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: chartpulse-cache
          type: keyvalue
          property: connectionString
